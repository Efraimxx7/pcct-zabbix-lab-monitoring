# UserParameters do template "Lab Escola"
# Adicione ao final de C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf
# Requer: Set-ExecutionPolicy RemoteSigned -Scope LocalMachine -Force

UnsafeUserParameters=1
Timeout=30

UserParameter=windows.top.process,powershell -NoProfile -NonInteractive -command "(Get-Process | Sort-Object CPU -Descending | Select-Object -First 1).ProcessName"

UserParameter=windows.defender.daysoutdated,powershell -NoProfile -NonInteractive -command "try{[int]([datetime]::Now - (Get-MpComputerStatus).AntivirusSignatureLastUpdated).TotalDays}catch{-1}"

UserParameter=windows.defender.realtime,powershell -NoProfile -NonInteractive -command "try{[int](Get-MpComputerStatus).RealTimeProtectionEnabled}catch{-1}"

UserParameter=windows.usb.count,powershell -NoProfile -NonInteractive -command "(Get-PnpDevice -Class USB | Where-Object {$_.Status -eq 'OK' -and $_.FriendlyName -like '*storage*'} | Measure-Object).Count"

UserParameter=windows.login.failures,powershell -NoProfile -NonInteractive -command "try{([System.Diagnostics.EventLog]::GetEventLogs() | Where-Object {$_.Log -eq 'Security'} | Select-Object -First 1).Entries | Where-Object {$_.EventID -eq 4625 -and $_.TimeWritten -gt (Get-Date).AddHours(-1)} | Measure-Object | Select-Object -ExpandProperty Count}catch{0}"

UserParameter=windows.firewall.status,powershell -NoProfile -NonInteractive -command "(Get-NetFirewallProfile | Where-Object {$_.Enabled -eq $true} | Measure-Object).Count"

UserParameter=windows.activation.status,powershell -NoProfile -NonInteractive -command "try{$s=(Get-WmiObject SoftwareLicensingProduct -Filter 'Name like ''Windows%'' and PartialProductKey is not null').LicenseStatus;if($s -eq 1){1}else{0}}catch{-1}"

UserParameter=temperatura.cpu.celsius,powershell -NoProfile -NonInteractive -command "try{$t=(Get-WmiObject MSAcpi_ThermalZoneTemperature -Namespace root/WMI -ErrorAction Stop).CurrentTemperature;[math]::Round(($t-2732)/10,1)}catch{-1}"

UserParameter=windows.updates.pending,powershell -NoProfile -NonInteractive -command "try{$u=(New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher().Search('IsInstalled=0');$u.Updates.Count}catch{-1}"
