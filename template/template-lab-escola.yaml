zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 8d714322ec35487284c759d7d4b380e4
    name: Templates/Operating systems
  templates:
  - uuid: 401901f7f0004288bd4d265b93d68f71
    template: Template Lab Escola
    name: Template Lab Escola
    description: 'Template Lab Escola - Zabbix 7.4.8


      Monitoramento de laboratorio de informatica escolar.


      ITENS: CPU, RAM, Disco LLD, Rede LLD, Servicos, Temperatura, Uptime, Hostname,
      Versao Windows, Usuarios, Ping.

      SEGURANCA: Firewall, USB, Updates, Falhas de Login (Requer UserParameters).


      (Monitoramento SMART removido por exigir software externo).'
    vendor:
      name: Lab Escola
      version: 7.4.8-1
    groups:
    - name: Templates/Operating systems
    items:
    - uuid: 38d54917d6bb4d549b419a77809e1246
      name: CPU - Utilizacao total
      key: system.cpu.util
      value_type: FLOAT
      units: '%'
      description: Percentual total de uso da CPU (0 a 100%).
      tags:
      - tag: component
        value: cpu
    - uuid: bd60ca69e5394a7eb760f72da2e3131e
      name: CPU - Tempo ocioso (idle)
      key: perf_counter_en["\Processor(_Total)\% Idle Time"]
      value_type: FLOAT
      units: '%'
      description: Percentual de CPU ociosa via Performance Counter. Mais confiavel
        que system.cpu.util[,idle] no Windows.
      tags:
      - tag: component
        value: cpu
    - uuid: 8abfe873f78f4838b73094f7d7ab74b7
      name: CPU - Carga media 1 minuto
      key: system.cpu.load[percpu,avg1]
      value_type: FLOAT
      description: Carga media por nucleo no ultimo 1 minuto.
      tags:
      - tag: component
        value: cpu
    - uuid: 53e1111b6b184104aab01b50b80986eb
      name: CPU - Carga media 5 minutos
      key: system.cpu.load[percpu,avg5]
      delay: 5m
      value_type: FLOAT
      description: Carga media por nucleo nos ultimos 5 minutos.
      tags:
      - tag: component
        value: cpu
    - uuid: 53555024b3c048e18142f90c158c2a8f
      name: CPU - Numero de nucleos
      key: system.cpu.num
      delay: 1h
      description: Total de nucleos e threads. Coletado uma vez por hora.
      tags:
      - tag: component
        value: cpu
    - uuid: 239fb5d5afbf49b6977fdde35b0a910f
      name: Processos - Total em execucao
      key: proc.num[]
      delay: 2m
      description: Total de processos ativos. Acima de 350 pode indicar problema.
      tags:
      - tag: component
        value: os
    - uuid: 0a9420f09d1e4439b3ac9a63d89c71fa
      name: Processos - Windows Defender (MsMpEng)
      key: proc.num[MsMpEng.exe]
      delay: 5m
      description: Instancias do processo do Windows Defender. Zero = antivirus nao
        esta rodando.
      tags:
      - tag: component
        value: security
    - uuid: 64dbb6541cb34a2c8e08404b94079eb5
      name: RAM - Disponivel (bytes)
      key: vm.memory.size[available]
      units: B
      description: RAM disponivel em bytes.
      tags:
      - tag: component
        value: memory
    - uuid: 934ddabe6c4d41c6b03db9d486329cc9
      name: RAM - Total instalada (bytes)
      key: vm.memory.size[total]
      delay: 1h
      units: B
      description: RAM total instalada. Coletado uma vez por hora.
      tags:
      - tag: component
        value: memory
    - uuid: 1cdd2c79142341f98a5f346970b27292
      name: RAM - Disponivel (%)
      key: vm.memory.size[pavailable]
      value_type: FLOAT
      units: '%'
      description: Percentual de RAM disponivel. Principal metrica para alertas de
        memoria.
      tags:
      - tag: component
        value: memory
    - uuid: 100effe294334041bc89de1a0f94d513
      name: RAM - Em uso (%)
      key: vm.memory.size[pused]
      value_type: FLOAT
      units: '%'
      description: Percentual de RAM em uso.
      tags:
      - tag: component
        value: memory
    - uuid: af8bd1ea306a4e2e817ec3796b491810
      name: RAM - Paginas por segundo
      key: perf_counter_en["\Memory\Pages/sec"]
      delay: 2m
      value_type: FLOAT
      description: Taxa de paginacao. Acima de 1000 indica falta de RAM.
      tags:
      - tag: component
        value: memory
    - uuid: 66f5dfaf7c00479baba33c71b1044d75
      name: Sistema - Uptime
      key: system.uptime
      delay: 30s
      units: uptime
      description: Tempo que o PC esta ligado. Abaixo de 5min indica reinicio recente.
      tags:
      - tag: component
        value: system
    - uuid: ee1d6f81c8614b73baf4196b8aff3712
      name: Sistema - Horario local
      key: system.localtime
      units: unixtime
      description: Horario local do PC. Usado para detectar relogios desincronizados.
      tags:
      - tag: component
        value: system
    - uuid: e4e5433fd52c4297993200bdd299f75a
      name: Zabbix agent - Disponibilidade
      type: INTERNAL
      key: zabbix[host,agent,available]
      description: Status de disponibilidade do agente Zabbix.
      valuemap:
        name: Zabbix agent availability
      tags:
      - tag: component
        value: system
    - uuid: e64405aa5d024c21b80ae2f0cf19ec84
      name: Servico - Print Spooler
      key: service.info[Spooler,state]
      delay: 2m
      description: Estado do Print Spooler. 0=Running(OK). Outros valores = problema.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: services
    - uuid: 22a3f16a2ccf46a59ddeb9390d993614
      name: Servico - Windows Defender Antivirus
      key: service.info[WinDefend,state]
      delay: 5m
      description: Estado do Windows Defender. Parado = PC sem antivirus.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: security
    - uuid: 1f3c67de4cd74a6492ebdd60a7056b07
      name: Servico - Windows Update
      key: service.info[wuauserv,state]
      delay: 5m
      description: Estado do Windows Update. Parado impede atualizacoes de seguranca.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: services
    - uuid: 0f6007fdcc024f22b6637ae5af927333
      name: Servico - Windows Time
      key: service.info[W32Time,state]
      delay: 5m
      description: Estado do servico de sincronizacao de horario.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: services
    - uuid: 363030c926734736811d5f6a6fc2f358
      name: Temperatura - CPU raw WMI (decikelvin)
      key: wmi.get[root/WMI,"SELECT CurrentTemperature FROM MSAcpi_ThermalZoneTemperature"]
      delay: 2m
      description: 'Temperatura bruta em decikelvin via WMI. ATENCAO: Pode nao ser
        suportado em todos os hardwares. Se aparecer como nao suportado, use o UserParameter
        alternativo: UserParameter=temperatura.cpu.celsius,powershell -NoProfile -NonInteractive
        -command "try{[math]::Round(((Get-WmiObject MSAcpi_ThermalZoneTemperature
        -Namespace root/WMI).CurrentTemperature - 2732) / 10, 1)}catch{-1}" e crie
        um item com key temperatura.cpu.celsius e type ZABBIX_PASSIVE.'
      tags:
      - tag: component
        value: hardware
      status: DISABLED
    - uuid: a3ee252add694347a9d70c8e10b237f2
      name: Temperatura - CPU (Celsius)
      type: DEPENDENT
      key: temperatura.cpu.celsius
      value_type: FLOAT
      units: C
      description: Temperatura da CPU em Celsius. Convertida do raw WMI via JavaScript
        preprocessing.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - return (value * 0.1) - 273.2;
      master_item:
        key: wmi.get[root/WMI,"SELECT CurrentTemperature FROM MSAcpi_ThermalZoneTemperature"]
      tags:
      - tag: component
        value: hardware
      status: DISABLED
    - uuid: b047c7fe08f54ef0b839031d7da2ce0b
      name: Windows - Atualizacoes pendentes
      key: windows.updates.pending
      delay: 6h
      description: Quantidade de atualizacoes pendentes. REQUER UserParameter - veja
        descricao do template.
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: 749f4dd0b61d4e11b74fc1a0b9531fe5
      name: Windows - Status de ativacao
      key: windows.activation.status
      delay: 1h
      description: Status de ativacao do Windows. 1=Ativado 0=NAO ativado -1=Erro.
        REQUER UserParameter - veja descricao do template.
      valuemap:
        name: Windows activation status
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: db24033e85bd4d549595c1cb6c75f139
      name: Filesystems - Get data (fonte LLD)
      key: vfs.fs.get
      history: 1h
      value_type: TEXT
      description: Dados brutos de todas as particoes. Fonte para discovery rule de
        disco.
      tags:
      - tag: component
        value: raw
    - uuid: 72b197d882a2408bb40a9df3b8399cf3
      name: Rede - WMI get interfaces (fonte LLD)
      key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID
        from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
      history: 1h
      value_type: TEXT
      description: Dados brutos das interfaces via WMI. Fonte para discovery rule
        de rede.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: raw
    - uuid: 2b2d96a29fd445578f55670d9509c8b8
      name: CPU - Uso por programas do usuario (%)
      key: perf_counter_en["\Processor(_Total)\% User Time"]
      value_type: FLOAT
      units: '%'
      description: Percentual de CPU usada por programas via Performance Counter.
      tags:
      - tag: component
        value: cpu
    - uuid: 7b3ae01886d84c9e9cb5e1923bd741e0
      name: CPU - Uso pelo sistema Windows (%)
      key: system.cpu.util[,system]
      value_type: FLOAT
      units: '%'
      description: Percentual de CPU consumido pelo proprio Windows (drivers, kernel).
      tags:
      - tag: component
        value: cpu
    - uuid: b751e11dab0f434eb43b38aa4040efa8
      name: Sistema - Timestamp do ultimo boot (WMI)
      key: wmi.get[root/cimv2,"SELECT LastBootUpTime FROM Win32_OperatingSystem"]
      delay: 10m
      description: 'Data e hora do ultimo reinicio do PC. NOTA: Requer Zabbix Agent
        2 v7.4.8. Se nao suportado, reinicie o servico do agente.'
      tags:
      - tag: component
        value: system
      value_type: TEXT
    - uuid: bb148bc6a5a34b3f88303ffd2caff8d3
      name: Servico - Audio do Windows (AudioSrv)
      key: service.info[AudioSrv,state]
      delay: 5m
      description: Estado do servico de audio. 0=Running(OK). Parado = sem som no
        laboratorio.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: services
    - uuid: 685bf2b4219a4ef0b46d740ad3f2ec73
      name: Servico - Log de Eventos (EventLog)
      key: service.info[EventLog,state]
      delay: 5m
      description: Estado do servico de Log de Eventos. Parado impede registro de
        erros criticos.
      valuemap:
        name: Windows service state
      tags:
      - tag: component
        value: services
    - uuid: 4e62c76b968b4645b52ce1964a9e82a0
      name: Event Log - Erros criticos no System
      type: ZABBIX_ACTIVE
      key: eventlog[System,,Error,,,,skip]
      delay: 2m
      value_type: LOG
      description: Coleta erros criticos do Event Viewer canal System. Requer ServerActive=
        configurado no agente.
      tags:
      - tag: component
        value: system
    - uuid: 1829fbbe85de4852808cd23c8b891591
      name: Event Log - Falhas de autenticacao (ID 4625)
      type: ZABBIX_ACTIVE
      key: eventlog[Security,,'Failure Audit',,4625,,skip]
      delay: 1m
      value_type: LOG
      description: Coleta eventos de falha de login (Event ID 4625). Requer ServerActive=
        configurado no agente.
      tags:
      - tag: component
        value: security
    - uuid: ece7c4f2e7d0459f835c4d331b12ba85
      name: Seguranca - Estado antivirus (SecurityCenter WMI)
      key: wmi.get[root/SecurityCenter2,"SELECT productState FROM AntiVirusProduct
        WHERE displayName='Windows Defender'"]
      delay: 30m
      description: Estado via SecurityCenter2. 397568=Ativo OK | 397312=Desativado
        | 393472=Desatualizado.
      tags:
      - tag: component
        value: security
    - uuid: 7790852cc98144bf9333cbd941ceb1c3
      name: Sistema - Quantidade de usuarios logados
      key: system.users.num
      delay: 2m
      description: Numero de usuarios com sessao ativa. Util para saber se o PC esta
        em uso.
      tags:
      - tag: component
        value: system
    - uuid: 54682859c5e64506a3d7992eee9ae09d
      name: Sistema - Nome do usuario logado
      key: wmi.get[root/cimv2,"SELECT UserName FROM Win32_ComputerSystem"]
      delay: 5m
      value_type: TEXT
      description: 'Usuario atual logado no PC (formato: DOMINIO\usuario).'
      tags:
      - tag: component
        value: system
    - uuid: 87f0734d1ffd4b28ae0cce4565335903
      name: Disco - Velocidade de leitura (bytes/s)
      key: perf_counter_en["\LogicalDisk(_Total)\Disk Read Bytes/sec"]
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: Taxa de leitura total do disco em bytes por segundo.
      tags:
      - tag: component
        value: storage
    - uuid: 86a1ece44fb34f618ba8d07da504d043
      name: Disco - Velocidade de escrita (bytes/s)
      key: perf_counter_en["\LogicalDisk(_Total)\Disk Write Bytes/sec"]
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: Taxa de escrita total do disco em bytes por segundo.
      tags:
      - tag: component
        value: storage
    - uuid: be99dee25adb436d8f1847a261ad1644
      name: Disco - Percentual de tempo ocupado (IOPS)
      key: perf_counter_en["\LogicalDisk(_Total)\% Disk Time"]
      delay: 1m
      value_type: FLOAT
      units: '%'
      description: Percentual do tempo que o disco ficou ocupado. Acima de 80% indica
        saturacao.
      tags:
      - tag: component
        value: storage
    - uuid: dd61e382c83248eaafbb69444b3b0dfb
      name: Sistema - Versao do Windows
      key: system.sw.os
      delay: 1h
      value_type: TEXT
      description: 'Versao completa do Windows. Ex: Windows 10 Pro 22H2.'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: a6efe0a1ccd24dc48b42384cd225b361
      name: Sistema - Nome do computador (hostname)
      key: system.hostname
      delay: 1h
      value_type: TEXT
      description: Nome do computador conforme configurado no Windows.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 8b587f7ac0844baebc40e4c6368c19e2
      name: Agente - Versao do Zabbix Agent
      key: agent.version
      delay: 1h
      value_type: TEXT
      description: Versao do Zabbix Agent instalado. Util para verificar uniformidade
        entre os PCs.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 24c8debe456f44a2af8b1587eb677684
      name: Agente - Ping (heartbeat)
      key: agent.ping
      description: O agente sempre retorna 1. Usado com nodata() para verificar disponibilidade.
      valuemap:
        name: Zabbix agent ping status
      tags:
      - tag: component
        value: system
    - uuid: 1f5b151240dc4d84925a5f63acf212bc
      name: Rede - Ping para o servidor Zabbix (online/offline)
      key: icmpping
      delay: 30s
      description: Verifica se o PC esta online. 1=online, 0=offline. Base para a
        trigger de PC offline.
      valuemap:
        name: Zabbix agent ping status
      tags:
      - tag: component
        value: network
      type: SIMPLE
    - uuid: 2ef7d1b794d24fa299d9b9d6d5c46570
      name: Rede - Perda de pacotes (%)
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      description: Percentual de pacotes ICMP perdidos. Acima de 20% indica problema
        fisico na rede (cabo, switch).
      tags:
      - tag: component
        value: network
      type: SIMPLE
    - uuid: 55d5c401eb1443bfa9203e49020fe586
      name: Rede - Latencia do ping (segundos)
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      description: Tempo de resposta do ping em segundos. Acima de 0.2s indica rede
        lenta.
      tags:
      - tag: component
        value: network
      type: SIMPLE
    - uuid: 75ca42f4dcdd436496b404b20afde325
      name: Rede - Ping para internet (8.8.8.8)
      key: icmpping[8.8.8.8]
      delay: 1m
      description: Verifica se o PC tem acesso a internet. 1=internet OK, 0=sem internet.
        Diferencia "PC offline" de "internet da escola caiu".
      valuemap:
        name: Zabbix agent ping status
      tags:
      - tag: component
        value: network
      type: SIMPLE
    - uuid: ca9f090aa93544aabb0daed0a7795313
      name: Rede - Latencia para internet (8.8.8.8)
      key: icmppingsec[8.8.8.8]
      delay: 1m
      value_type: FLOAT
      units: s
      description: Tempo de resposta do ping para o DNS do Google em segundos.
      tags:
      - tag: component
        value: network
      type: SIMPLE
    - uuid: ed3697f0cd2e471cbc53837864f996c3
      name: Seguranca - Firewall do Windows (perfis ativos)
      key: windows.firewall.status
      delay: 5m
      description: 'Verifica quantos perfis do firewall estao ativos (Domain, Private,
        Public). Valor esperado: 3 (todos ativos). REQUER UserParameter no agente:

        UserParameter=windows.firewall.status,powershell -NoProfile -NonInteractive
        -command "(Get-NetFirewallProfile | Where-Object {$_.Enabled -eq $true} |
        Measure-Object).Count"'
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: 676bcda079f14fc8ab0e5bec74d0d279
      name: Seguranca - Dispositivos USB conectados
      key: windows.usb.count
      delay: 2m
      description: 'Conta dispositivos USB de armazenamento conectados ao PC. Qualquer
        valor acima de 0 pode indicar pendrive conectado por aluno. REQUER UserParameter
        no agente:

        UserParameter=windows.usb.count,powershell -NoProfile -NonInteractive -command
        "(Get-PnpDevice -Class USB | Where-Object {$_.Status -eq ''OK'' -and $_.FriendlyName
        -like ''*storage*''} | Measure-Object).Count"'
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: 61018d7d2b3a4d109b4d82111a8c606a
      name: Seguranca - Defender protecao em tempo real
      key: windows.defender.realtime
      delay: 10m
      description: 'Verifica se a protecao em tempo real do Defender esta ativa. 1=ativa
        (OK), 0=desativada (ALERTA). REQUER UserParameter no agente:

        UserParameter=windows.defender.realtime,powershell -NoProfile -NonInteractive
        -command "try{[int](Get-MpComputerStatus).RealTimeProtectionEnabled}catch{-1}"'
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: a801348b6e8a4e138b7bb5d48505d054
      name: Seguranca - Defender dias desde ultima atualizacao
      key: windows.defender.daysoutdated
      delay: 1h
      description: 'Retorna quantos dias se passaram desde a ultima atualizacao das
        definicoes do Defender. Acima de 3 dias indica definicoes desatualizadas.
        REQUER UserParameter no agente:

        UserParameter=windows.defender.daysoutdated,powershell -NoProfile -NonInteractive
        -command "try{[int]([datetime]::Now - (Get-MpComputerStatus).AntivirusSignatureLastUpdated).TotalDays}catch{-1}"'
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: 89e1aaa8ad134eb8baab86c7e1cb7cc8
      name: Seguranca - Falhas de login na ultima hora (contador)
      key: windows.login.failures
      delay: 5m
      description: 'Conta tentativas de login falhas (Event ID 4625) na ultima hora.
        Mais de 10 em pouco tempo pode indicar tentativa de invasao. REQUER UserParameter
        no agente:

        UserParameter=windows.login.failures,powershell -NoProfile -NonInteractive
        -command "try{([System.Diagnostics.EventLog]::GetEventLogs() | Where-Object
        {$_.Log -eq ''Security''} | Select-Object -First 1).Entries | Where-Object
        {$_.EventID -eq 4625 -and $_.TimeWritten -gt (Get-Date).AddHours(-1)} | Measure-Object
        | Select-Object -ExpandProperty Count}catch{0}"'
      tags:
      - tag: component
        value: security
      value_type: TEXT
    - uuid: 70dd7409f24b4cdfba9e944a27ddaf74
      name: Performance - Top processo por CPU
      key: windows.top.process
      delay: 5m
      value_type: TEXT
      description: 'Retorna o nome do processo que mais consome CPU no momento. Util
        para diagnosticar PC lento. REQUER UserParameter no agente:

        UserParameter=windows.top.process,powershell -NoProfile -NonInteractive -command
        "(Get-Process | Sort-Object CPU -Descending | Select-Object -First 1).ProcessName"'
      tags:
      - tag: component
        value: cpu
    discovery_rules:
    - uuid: 24f214afe6304fc4aa0ae1bb9fd75e48
      name: Disco - Descoberta automatica de particoes
      type: DEPENDENT
      key: vfs.fs.dependent.discovery
      description: Descobre automaticamente todas as particoes fixas e cria itens
        para cada uma. Aguarde 5 a 10 minutos para os itens aparecerem.
      filter:
        evaltype: AND
        conditions:
        - macro: '{#FSDRIVETYPE}'
          value: fixed
        - macro: '{#FSDRIVETYPE}'
          value: ^\s$
          operator: NOT_MATCHES_REGEX
        - macro: '{#FSNAME}'
          value: .*
        - macro: '{#FSNAME}'
          value: ^(?:/dev|/sys|/run|/proc|.+/shm$)
          operator: NOT_MATCHES_REGEX
      item_prototypes:
      - uuid: 0bcc431e7b6f4455a84711742d350d6c
        name: Disco {#FSLABEL}({#FSNAME}) - Dados brutos
        type: DEPENDENT
        key: vfs.fs.dependent[{#FSNAME},data]
        history: 1h
        value_type: TEXT
        description: Dados intermediarios da particao.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.fsname=='{#FSNAME}')].first()
        master_item:
          key: vfs.fs.get
        tags:
        - tag: component
          value: storage
        - tag: filesystem
          value: '{#FSNAME}'
      - uuid: db3b7c34081d459fb8d5dc5ae5e5e33b
        name: Disco {#FSLABEL}({#FSNAME}) - Espaco livre (bytes)
        type: DEPENDENT
        key: vfs.fs.dependent.size[{#FSNAME},free]
        units: B
        description: Espaco livre em bytes.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.bytes.free
        master_item:
          key: vfs.fs.dependent[{#FSNAME},data]
        tags:
        - tag: component
          value: storage
        - tag: filesystem
          value: '{#FSNAME}'
      - uuid: a652ad8a0d1547dc9cf8600e68b921c5
        name: Disco {#FSLABEL}({#FSNAME}) - Total (bytes)
        type: DEPENDENT
        key: vfs.fs.dependent.size[{#FSNAME},total]
        units: B
        description: Tamanho total da particao em bytes.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.bytes.total
        master_item:
          key: vfs.fs.dependent[{#FSNAME},data]
        tags:
        - tag: component
          value: storage
        - tag: filesystem
          value: '{#FSNAME}'
      - uuid: 143c839ab9ae4b0ba99a3f2cc51fb946
        name: Disco {#FSLABEL}({#FSNAME}) - Em uso (bytes)
        type: DEPENDENT
        key: vfs.fs.dependent.size[{#FSNAME},used]
        units: B
        description: Espaco usado em bytes.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.bytes.used
        master_item:
          key: vfs.fs.dependent[{#FSNAME},data]
        tags:
        - tag: component
          value: storage
        - tag: filesystem
          value: '{#FSNAME}'
      - uuid: c395c31297f6474283ad9829645fbc59
        name: Disco {#FSLABEL}({#FSNAME}) - Em uso (%)
        type: DEPENDENT
        key: vfs.fs.dependent.size[{#FSNAME},pused]
        value_type: FLOAT
        units: '%'
        description: Percentual de espaco usado. Principal metrica para alertas de
          disco.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.bytes.pused
        master_item:
          key: vfs.fs.dependent[{#FSNAME},data]
        tags:
        - tag: component
          value: storage
        - tag: filesystem
          value: '{#FSNAME}'
        trigger_prototypes:
        - uuid: fe26e84e2f7d49da88947eb654b380a4
          expression: min(/Template Lab Escola/vfs.fs.dependent.size[{#FSNAME},pused],5m)>98
          name: 'Disco {#FSLABEL}({#FSNAME}) - DISASTER: praticamente cheio em {HOST.NAME}'
          priority: DISASTER
          description: Menos de 2% de espaco livre. O Windows pode travar.
          manual_close: 'YES'
          tags:
          - tag: scope
            value: capacity
        - uuid: 9898db413f304a659edc56603b34154a
          expression: min(/Template Lab Escola/vfs.fs.dependent.size[{#FSNAME},pused],5m)>{$VFS.FS.PUSED.MAX.CRIT}
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: min(/Template Lab Escola/vfs.fs.dependent.size[{#FSNAME},pused],5m)<{$VFS.FS.PUSED.MAX.CRIT}-3
          name: Disco {#FSLABEL}({#FSNAME}) - Espaco critico em {HOST.NAME}
          priority: HIGH
          description: Uso de disco acima do limite critico ({$VFS.FS.PUSED.MAX.CRIT}%,
            padrao 90%).
          manual_close: 'YES'
          tags:
          - tag: scope
            value: capacity
        - uuid: 637ba78ce15a4cc19f5f9f96486bcadb
          expression: min(/Template Lab Escola/vfs.fs.dependent.size[{#FSNAME},pused],5m)>{$VFS.FS.PUSED.MAX.WARN}
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: min(/Template Lab Escola/vfs.fs.dependent.size[{#FSNAME},pused],5m)<{$VFS.FS.PUSED.MAX.WARN}-3
          name: Disco {#FSLABEL}({#FSNAME}) - Espaco em aviso em {HOST.NAME}
          priority: WARNING
          description: Uso de disco acima do limite de aviso ({$VFS.FS.PUSED.MAX.WARN}%,
            padrao 80%).
          manual_close: 'YES'
          tags:
          - tag: scope
            value: capacity
      graph_prototypes:
      - uuid: 16dcbf1fe03d4bfda302550874b7bc7a
        name: Disco {#FSLABEL}({#FSNAME}) - Uso de espaco (%)
        width: '600'
        height: '340'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - drawtype: FILLED_REGION
          color: F63100
          calc_fnc: ALL
          item:
            host: Template Lab Escola
            key: vfs.fs.dependent.size[{#FSNAME},pused]
      master_item:
        key: vfs.fs.get
      lld_macro_paths:
      - lld_macro: '{#FSDRIVETYPE}'
        path: $.fsdrivetype
      - lld_macro: '{#FSLABEL}'
        path: $.fslabel
      - lld_macro: '{#FSNAME}'
        path: $.fsname
      - lld_macro: '{#FSTYPE}'
        path: $.fstype
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var filesystems = JSON.parse(value);\nresult = filesystems.map(function(fs)\
          \ {\n  return {'fsname': fs.fsname, 'fstype': fs.fstype, 'fslabel': fs.fslabel,\
          \ 'fsdrivetype': fs.fsdrivetype};\n});\nreturn JSON.stringify(result);"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    - uuid: 9164a23892364de9a18336309eb64c77
      name: Rede - Descoberta automatica de interfaces
      type: DEPENDENT
      key: net.if.discovery
      description: Descobre automaticamente interfaces de rede fisicas e ativas.
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: .*
        - macro: '{#IFNAME}'
          value: Miniport|Virtual|Teredo|Kernel|Loopback|Bluetooth|6to4|QoS
          operator: NOT_MATCHES_REGEX
      item_prototypes:
      - uuid: bb7ae9e1608c4dfba59dc1cb1f6bde02
        name: Rede {#IFNAME}({#IFALIAS}) - Bits recebidos
        key: net.if.in["{#IFGUID}"]
        delay: 1m
        units: bps
        description: Trafego de entrada em bits por segundo.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: f8a40be36fc14defab8280ac188b80ad
        name: Rede {#IFNAME}({#IFALIAS}) - Bits enviados
        key: net.if.out["{#IFGUID}"]
        delay: 1m
        units: bps
        description: Trafego de saida em bits por segundo.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6f3fd95162af43fba98f829e6e85449b
        name: Rede {#IFNAME}({#IFALIAS}) - Erros de entrada
        key: net.if.in["{#IFGUID}",errors]
        delay: 2m
        description: Pacotes recebidos com erro. Valor alto indica cabo ou switch
          com problema.
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 22a472106f0f4835801d88935458e5d9
        name: Rede {#IFNAME}({#IFALIAS}) - Erros de saida
        key: net.if.out["{#IFGUID}",errors]
        delay: 2m
        description: Pacotes enviados com erro.
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 62a7c02eabac4f0e9310f3b5d241504f
        name: Rede {#IFNAME}({#IFALIAS}) - Velocidade
        type: DEPENDENT
        key: net.if.speed["{#IFGUID}"]
        trends: '0'
        units: bps
        description: Velocidade estimada da interface.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.GUID == "{#IFGUID}")].Speed.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: JAVASCRIPT
          parameters:
          - 'return (value==''9223372036854775807'' ? 0 : value)'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID
            from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: be9cb4dbf4ed410b878e8ae54210117c
        name: Rede {#IFNAME}({#IFALIAS}) - Status operacional
        type: DEPENDENT
        key: net.if.status["{#IFGUID}"]
        trends: '0'
        description: 2=Conectado(OK). Outros valores indicam problema.
        valuemap:
          name: Win32_NetworkAdapter NetConnectionStatus
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.GUID == "{#IFGUID}")].NetConnectionStatus.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID
            from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: d606723be8f94875af400b9d5aa9617b
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Template Lab Escola/net.if.status["{#IFGUID}"])<>2
            and (last(/Template Lab Escola/net.if.status["{#IFGUID}"],#1)<>last(/Template
            Lab Escola/net.if.status["{#IFGUID}"],#2))'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Template Lab Escola/net.if.status["{#IFGUID}"])=2
            or {$IFCONTROL:"{#IFNAME}"}=0
          name: Interface {#IFNAME}({#IFALIAS}) - Desconectada em {HOST.NAME}
          priority: AVERAGE
          description: Interface de rede desconectada. Verifique cabo ou porta do
            switch.
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
      trigger_prototypes:
      - uuid: f614be32d7c94478bafb846dd62b3069
        expression: min(/Template Lab Escola/net.if.in["{#IFGUID}",errors],5m)>50
          or min(/Template Lab Escola/net.if.out["{#IFGUID}",errors],5m)>50
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/Template Lab Escola/net.if.in["{#IFGUID}",errors],5m)<10
          and max(/Template Lab Escola/net.if.out["{#IFGUID}",errors],5m)<10
        name: Interface {#IFNAME}({#IFALIAS}) - Alta taxa de erros em {HOST.NAME}
        priority: WARNING
        description: Mais de 50 erros/seg na interface. Indica problema fisico de
          rede.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
      graph_prototypes:
      - uuid: 47cc17b99d6f4dbc982da892687fe608
        name: Rede {#IFNAME}({#IFALIAS}) - Trafego
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: Template Lab Escola
            key: net.if.in["{#IFGUID}"]
        - sortorder: '1'
          drawtype: GRADIENT_LINE
          color: F63100
          item:
            host: Template Lab Escola
            key: net.if.out["{#IFGUID}"]
      master_item:
        key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID
          from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "output = JSON.parse(value).map(function(net){\n  return {\n    \"{#IFNAME}\"\
          : net.Name,\n    \"{#IFDESCR}\": net.Description,\n    \"{#IFALIAS}\": net.NetConnectionID,\n\
          \    \"{#IFGUID}\": net.GUID\n  }\n})\nreturn JSON.stringify({\"data\":\
          \ output})"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
