  triggers:
  - uuid: c4e5ecd5cb4d40e0b4a89818d6bf0eff
    expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\% Idle
      Time"],5m)<2
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\%
      Idle Time"],5m)>=5
    name: CPU completamente saturada em {HOST.NAME}
    opdata: 'Idle: {ITEM.LASTVALUE1}'
    priority: DISASTER
    description: CPU com menos de 2% de idle por 5 minutos. PC provavelmente congelado.
    tags:
    - tag: scope
      value: performance
  - uuid: fd2a81dd15614b3d8826fdb06e905b80
    expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\% Idle
      Time"],5m)<10
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\%
      Idle Time"],5m)>=15
    name: CPU critica (>90%) em {HOST.NAME}
    opdata: 'Idle: {ITEM.LASTVALUE1}'
    priority: HIGH
    description: CPU acima de 90% por 5 minutos. PC muito lento.
    tags:
    - tag: scope
      value: performance
  - uuid: baece332b2514c65912a3bce74595b9e
    expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\% Idle
      Time"],5m)<25
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\%
      Idle Time"],5m)>=30
    name: CPU alta (>75%) em {HOST.NAME}
    opdata: 'Idle: {ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: CPU acima de 75% por 5 minutos.
    tags:
    - tag: scope
      value: performance
  - uuid: ed88994cab6845fe9064a7cb1902feed
    expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\% Idle
      Time"],10m)<40
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: avg(/Template Lab Escola/perf_counter_en["\Processor(_Total)\%
      Idle Time"],10m)>=45
    name: CPU elevada (>60%) em {HOST.NAME}
    opdata: 'Idle: {ITEM.LASTVALUE1}'
    priority: WARNING
