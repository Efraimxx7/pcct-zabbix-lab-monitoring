    name: RAM critica - menos de 5% livre em {HOST.NAME}
    opdata: 'Disponivel: {ITEM.LASTVALUE1}'
    priority: HIGH
    description: Menos de 5% de RAM. Windows usa intensamente o arquivo de paginacao.
    tags:
    - tag: scope
      value: capacity
  - uuid: 22718dc8db804f3aa5788ecf8bde0b2f
    expression: last(/Template Lab Escola/vm.memory.size[pavailable])<10
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/Template Lab Escola/vm.memory.size[pavailable])>=12
    name: RAM baixa - menos de 10% livre em {HOST.NAME}
    opdata: 'Disponivel: {ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: Menos de 10% de RAM. PC comeca a ficar lento.
    tags:
    - tag: scope
      value: capacity
  - uuid: 702d47688c5844649fdfc2f0aa78a978
    expression: avg(/Template Lab Escola/vm.memory.size[pavailable],10m)<20
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: avg(/Template Lab Escola/vm.memory.size[pavailable],10m)>=22
